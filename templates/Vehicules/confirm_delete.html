{% extends "base.html" %}
{% block title %}Supprimer{% endblock %}

{% block main %}
<h1>Supprimer le véhicule ?</h1>
<p class="lead">Immatriculation : {{ object.immatriculation }}</p>
<p>Cette action est définitive.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Oui, supprimer</button>
    <a class="btn btn-link" href="{% url 'vehicules:list' %}">Annuler</a>
</form>
{% endblock %}
