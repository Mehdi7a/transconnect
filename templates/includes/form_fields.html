{% if form.non_field_errors %}
<div class="alert alert-danger">
    {% for e in form.non_field_errors %}<div>{{ e }}</div>{% endfor %}
</div>
{% endif %}

{% for field in form %}
<div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
    {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
</div>
{% endfor %}

<script>
document.querySelectorAll('form input:not([type=hidden]):not([type=checkbox]), form select, form textarea')
    .forEach(el => el.classList.add(el.tagName === 'SELECT' ? 'form-select' : 'form-control'));
document.querySelectorAll('form input[type=checkbox]').forEach(el => el.classList.add('form-check-input'));
</script>
