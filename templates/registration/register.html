{% extends "base.html" %}

{% block title %}Inscription{% endblock %}

{% block main %}
<h2>Créer un compte</h2>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-warning">S'inscrire</button>
</form>

<p class="mt-3">
  Déjà un compte ? <a href="{% url 'login' %}">Se connecter</a>
</p>
{% endblock %}
