{% extends "base.html" %}
{% block title %}Offre{% endblock %}

{% block main %}
<h1 class="mb-4">Offre</h1>
<form method="post" class="col-lg-6">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button type="submit" class="btn btn-primary">Envoyer l'offre</button>
    <a class="btn btn-link" href="{% url 'offres:liste' %}">Annuler</a>
</form>
{% endblock %}
